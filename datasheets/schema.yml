    - "Use the checked-in onsemi PDF for comparator limits and timing."
    - "Use the BSP source for pin modes, pulls, ADC attenuation, and calibration."

interface:
  type: "analog + digital (GPIO)"
  connector: "HY2.0-4P, PORT.B"
  pins:
    - { wire: "black", signal: "GND", j1_pin: 4 }
    - { wire: "red", signal: "5V (VCC)", j1_pin: 3 }
    - { wire: "yellow", signal: "Din (comparator output)", j1_pin: 2, core2foraws_gpio: 26, bsp_macro: "PORT_B_DAC_PIN" }
    - { wire: "white", signal: "Ain (divider voltage)", j1_pin: 1, core2foraws_gpio: 36, bsp_macro: "PORT_B_ADC_PIN" }

board:
  power: "VCC (5 V) -> HT7533 LDO (U2) -> +3.3 V; C1 100 nF, C3 100 nF, C4 10 uF, C5 10 uF"
  divider:
    topology: "+3.3 V -> R1 10 kOhm -> Ain -> R4 photoresistor -> GND"
    filter: "C2 100 nF from Ain to GND; tau <= (10 kOhm || R4) * 100 nF <= 1 ms"
    ain_volts: "3.3 * R4 / (10k + R4)"
    r4_ohms: "10000 * Ain / (3.3 - Ain)"
    direction: "More light -> lower R4 -> lower Ain. Higher millivolts mean darker."
  threshold:
    potentiometer: "R3 10 kOhm between +3.3 V and GND; wiper -> LM393 IN- (pin 2)"
    comparator_inputs: { in_plus: "Ain (pin 3)", in_minus: "R3 wiper (pin 2)" }
    output: "LM393 pin 1, open collector, R2 10 kOhm pull-up to +3.3 V -> Din"
    din_high: "Ain > wiper (darker than threshold)"
    din_low: "Ain < wiper (brighter than threshold)"
    hysteresis: "none fitted; Din can toggle repeatedly near the threshold"
  unused: "U1B (second comparator) has no connections shown."

# Chip-level facts from LM393.pdf (LM393 column, TA = 25 C unless noted).
lm393:
  supply_volts: { single: [2.0, 36], abs_max: 36 }
  input_common_mode_volts:
    ta_25c: "0 to VCC - 1.5"
    full_range: "0 to VCC - 2.0"
    abs_min: -0.3
    note_8: "Output state stays correct if one input exceeds VCC while the other stays within the common-mode range."
  input_offset_mv: { typ: 1.0, max: 5.0, max_full_range: 9.0 }
  input_bias_na: { typ: 20, max: 250 }
  output:
    type: "open collector"
    sink_ma_min: 6.0 # VO <= 1.5 V
    vol_mv: { typ: 150, max: 400, max_full_range: 700, at_isink_ma: 4.0 }
    abs_max_sink_ma: 20
  response_time_us_typ: 1.3 # 100 mV step, 5 mV overdrive, RL 5.1 kOhm to 5 V
  supply_current_ma: { typ: 0.4, max: 1.0, condition: "both comparators, no load" }
  operating_temperature_c: [0, 70]

# ESP32 and BSP facts that determine what the host can measure.
host:
  adc:
    gpio: 36
    unit_channel: "ADC1 channel 0"
    attenuation: "ADC_ATTEN_DB_12 (BSP)"
    calibrated_range_mv: [150, 2450]
    calibrated_error_mv: 60
    notes:
      - "Above about 2450 mV (R4 > about 29 kOhm, dim light) accuracy is worse than specified."
      - "Below 150 mV (R4 < about 480 Ohm, bright light) is outside the calibrated range."
      - "core2foraws_expports_adc_mv_read() returns ESP_ERR_NOT_SUPPORTED if no calibration scheme is available."
      - "GPIO 36 has no internal pull resistors; it floats when the unit is unplugged."
  din_gpio:
    gpio: 26
    bsp_input_mode: "input with internal pull-down enabled"
    pull_down_kohm_typ: 45
    vdd_volts: 3.35 # BSP pins AXP192 DCDC1 at 3350 mV
    vih_min: "0.75 * VDD (2.51 V)"
    vil_max: "0.25 * VDD (0.84 V)"
    din_high_volts: "3.3 * 45k / (45k + 10k) = 2.70 V typ"
    notes:
      - "Unplugged, GPIO 26 reads low, which is indistinguishable from 'bright'."
      - "Neither pin can detect whether the unit is connected."

board_usage:
  analog: "Average several calibrated ADC reads; report millivolts where higher means darker."
  digital: "Read Din as 'darker than the potentiometer threshold'. Debounce in the application if needed."
  threshold_range: "Keep the wiper at or below VCC - 1.5 V (1.8 V at 25 C; 1.3 V over 0-70 C) so IN- stays inside the common-mode range. That corresponds to R4 thresholds up to about 12 kOhm (6.5 kOhm worst case)."
